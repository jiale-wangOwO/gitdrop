name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GitDrop-Windows
          - os: macos-15-intel
            artifact: GitDrop-macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name GitDrop --collect-all tkinterdnd2 main.py
          Compress-Archive -Path dist/GitDrop.exe,README.md,LICENSE -DestinationPath GitDrop-Windows.zip

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name GitDrop --collect-all tkinterdnd2 main.py
          ditto -c -k --sequesterRsrc --keepParent dist/GitDrop.app GitDrop-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: GitDrop-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/GitDrop-*.zip
